[project]
name = "humg-quyche-assistant"
version = "0.1.0"
description = "Trợ lý hỏi đáp quy chế cho sinh viên HUMG, trả lời có trích dẫn đến từng điều, khoản."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "viettt0119" }]
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5.0,<7",
    "rich>=13.9",
    "typer>=0.15,<1",
]

[project.scripts]
quyche = "quyche.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quyche"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]
# Văn bản tiếng Việt trong chuỗi, docstring và comment là chủ ý, không phải ký tự gây nhầm lẫn.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test của phần lõi bạn tự viết được gắn marker `todo` và bị bỏ qua mặc định.
# Xem còn bao nhiêu việc:  uv run pytest -m todo
addopts = ["-ra", "-m", "not todo"]
markers = [
    "todo: test cho phần lõi bạn tự viết; xóa marker khi đã cài đặt xong",
]
